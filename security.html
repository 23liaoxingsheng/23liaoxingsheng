<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>智慧安保指挥中心 | 小学多场景应急系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap');
        * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background: #0a0f1a; color: #e2e8f0; overflow: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.1); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        .glass-card { background: rgba(20, 30, 55, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(0, 212, 255, 0.15); transition: all 0.3s ease; }
        .monitor-card { transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); cursor: pointer; }
        .monitor-card:hover { transform: translateY(-6px) scale(1.02); border-color: #3b82f6; box-shadow: 0 20px 35px -12px rgba(59, 130, 246, 0.4); }
        .zone-item.active { background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(0, 212, 255, 0.1)); border-left: 3px solid #3b82f6; }
        .scenario-btn.active-scenario { background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(0, 212, 255, 0.15)); border-color: #3b82f6; color: #60a5fa; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-critical { background: #ef4444; box-shadow: 0 0 8px #ef4444; animation: pulse 1s infinite; }
        .status-warning { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }
        .status-normal { background: #10b981; box-shadow: 0 0 6px #10b981; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
        .emergency-btn { position: fixed; bottom: 30px; right: 30px; width: 70px; height: 70px; background: linear-gradient(135deg, #ef4444, #dc2626); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; color: white; font-size: 28px; cursor: pointer; box-shadow: 0 0 30px rgba(239, 68, 68, 0.6); transition: all 0.3s; z-index: 100; }
        .emergency-btn:hover { transform: scale(1.1); }
        .toast { position: fixed; top: 100px; right: 30px; background: rgba(15, 25, 45, 0.98); backdrop-filter: blur(12px); border-left: 4px solid #3b82f6; border-radius: 12px; padding: 14px 20px; min-width: 300px; transform: translateX(420px); transition: transform 0.4s ease; z-index: 200; }
        .toast.show { transform: translateX(0); }
        .heatmap-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0f1a; z-index: 1000; display: none; flex-direction: column; animation: fadeInModal 0.3s ease; }
        .heatmap-modal.active { display: flex; }
        @keyframes fadeInModal { from { opacity: 0; } to { opacity: 1; } }
        .modal-header-bar { background: rgba(30, 41, 59, 0.95); border-bottom: 1px solid rgba(148, 163, 184, 0.2); padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .modal-close-btn { width: 36px; height: 36px; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; border-radius: 50%; color: #ef4444; font-size: 18px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
        .modal-close-btn:hover { background: #ef4444; color: white; transform: rotate(90deg); }
        .heatmap-launch-btn { background: linear-gradient(135deg, #f59e0b, #ea580c); border: none; transition: all 0.3s; }
        .heatmap-launch-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(245, 158, 11, 0.5); }
        .slider-track { -webkit-appearance: none; appearance: none; height: 4px; background: #334155; border-radius: 2px; outline: none; }
        .slider-track::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #f59e0b; border-radius: 50%; cursor: pointer; border: 2px solid #1e293b; }
        .legend-gradient { background: linear-gradient(to right, #3b82f6, #10b981, #f59e0b, #ef4444); }
        .time-marker.active { color: #f59e0b; font-weight: 600; }
        .grid-bg { background-image: linear-gradient(rgba(148,163,184,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,0.03) 1px, transparent 1px); background-size: 20px 20px; }
        .floor-tab { transition: all 0.2s; cursor: pointer; }
        .floor-tab.active { background: #f59e0b; color: #0f172a; font-weight: 600; }
        .floor-tab:hover:not(.active) { background: rgba(245, 158, 11, 0.3); }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="glass-panel h-14 flex items-center justify-between px-6 z-20 flex-shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-lg flex items-center justify-center shadow-lg"><i class="fas fa-shield-alt text-white text-sm"></i></div>
            <div><h1 class="text-base font-bold text-white tracking-tight">小学多场景应急系统 · 智慧安保指挥中心</h1><p class="text-[10px] text-slate-400">Primary School Multi-Scenario Emergency | Security Command Center</p></div>
        </div>
        <div class="flex items-center gap-4">
            <button id="openHeatmapBtn" class="heatmap-launch-btn px-5 py-2 rounded-full text-sm font-bold flex items-center gap-2 shadow-lg"><i class="fas fa-fire"></i> 教学楼热力图</button>
            <div class="flex items-center gap-2 text-xs"><span class="status-dot status-normal"></span><span class="text-slate-300">系统正常</span></div>
            <div class="h-5 w-px bg-slate-700"></div>
            <div class="text-right"><div class="text-sm font-mono text-cyan-400" id="currentTime">--:--:--</div><div class="text-[10px] text-slate-500" id="currentDate">----年--月--日</div></div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden p-4 gap-4">
        <aside class="w-64 glass-panel rounded-2xl flex flex-col overflow-hidden flex-shrink-0">
            <div class="p-4 border-b border-slate-700/50"><h2 class="text-xs font-semibold text-slate-300 mb-3 flex items-center gap-2"><i class="fas fa-map-marker-alt text-cyan-400"></i> 监控区域</h2><div class="space-y-1.5" id="zoneMenu"></div></div>
            <div class="p-4 border-b border-slate-700/50"><h2 class="text-xs font-semibold text-slate-300 mb-3 flex items-center gap-2"><i class="fas fa-exclamation-triangle text-orange-400"></i> 应急场景模拟</h2><div class="space-y-1.5" id="scenarioMenu"></div></div>
            <div class="p-4 flex-1"><h2 class="text-xs font-semibold text-slate-300 mb-3 flex items-center gap-2"><i class="fas fa-chart-line text-cyan-400"></i> 实时统计</h2><div class="space-y-3"><div class="bg-slate-800/40 rounded-xl p-3"><div class="text-[10px] text-slate-400">当前区域估算人数</div><div class="text-2xl font-bold text-white" id="zoneTotal">0</div></div><div class="bg-slate-800/40 rounded-xl p-3"><div class="text-[10px] text-slate-400">⚠️ 最高风险区域</div><div class="text-sm font-semibold text-red-400" id="hotArea">-</div><div class="w-full bg-slate-700 rounded-full h-1.5 mt-2"><div class="bg-red-500 h-1.5 rounded-full" id="hotBar" style="width:0%"></div></div></div><div class="bg-slate-800/40 rounded-xl p-3"><div class="text-[10px] text-slate-400">平均人群密度</div><div class="text-lg font-bold text-cyan-400" id="avgDensity">0 人/m²</div></div></div></div>
        </aside>

        <main class="flex-1 flex flex-col gap-4 min-w-0">
            <div class="glass-card rounded-xl px-4 py-3 flex items-center justify-between flex-shrink-0"><div class="flex items-center gap-3"><div class="w-8 h-8 bg-cyan-500/20 rounded-lg flex items-center justify-center"><i class="fas fa-video text-cyan-400 text-sm"></i></div><div><div class="text-sm font-semibold text-white" id="zoneName">教学楼区</div><div class="text-[10px] text-slate-400" id="zoneDesc">24路摄像头 · 实时监控</div></div></div><div class="flex items-center gap-4 text-xs"><div><span class="text-slate-400">在线率</span> <span class="text-green-400 font-mono" id="onlineRate">100%</span></div><div><span class="text-slate-400">今日预警</span> <span class="text-orange-400 font-mono" id="todayAlerts">3</span></div></div></div>
            <div class="grid grid-cols-3 gap-3 flex-1 min-h-0" id="monitorGrid"></div>
        </main>

        <aside class="w-64 glass-panel rounded-2xl flex flex-col overflow-hidden flex-shrink-0"><div class="p-3 border-b border-slate-700/50"><h2 class="text-xs font-semibold text-slate-300 flex items-center gap-2"><i class="fas fa-bell text-red-400"></i> 实时预警<span class="ml-auto text-[10px] text-red-400 animate-pulse">● LIVE</span></h2></div><div class="flex-1 overflow-y-auto p-3 space-y-2" id="alertList"></div><div class="p-3 border-t border-slate-700/50"><h2 class="text-xs font-semibold text-slate-300 mb-2 flex items-center gap-2"><i class="fas fa-user-shield text-cyan-400"></i> 执勤人员</h2><div class="space-y-2" id="teamList"></div></div></aside>
    </div>

    <button id="emergencyBtn" class="emergency-btn"><i class="fas fa-bell"></i></button>
    <div id="toast" class="toast"><div class="flex items-center gap-2"><i class="fas fa-info-circle text-cyan-400"></i><span class="text-sm font-semibold" id="toastTitle">系统通知</span></div><div class="text-xs text-slate-300 mt-1" id="toastMsg">消息内容</div></div>
    <div id="cameraModal" class="fixed inset-0 bg-black/90 backdrop-blur-xl z-[1000] hidden items-center justify-center" onclick="if(event.target===this) closeCameraModal()"><div class="w-[85vw] max-w-5xl glass-panel rounded-2xl overflow-hidden"><div class="p-4 border-b border-cyan-500/30 flex justify-between items-center"><h2 class="text-lg font-bold text-cyan-400"><i class="fas fa-camera mr-2"></i><span id="modalCameraName">监控画面</span></h2><button onclick="closeCameraModal()" class="w-8 h-8 rounded-full bg-red-500/20 text-red-400 hover:bg-red-500/40">✕</button></div><div class="p-6"><div class="aspect-video bg-black rounded-xl overflow-hidden"><img id="modalCameraImg" src="" class="w-full h-full object-cover"></div><div class="mt-4 text-sm text-slate-300" id="modalCameraDesc"></div></div></div></div>

    <div id="heatmapModal" class="heatmap-modal"><div id="heatmapContent" style="flex:1; display: flex; flex-direction: column; overflow: hidden;"></div></div>

    <script>
        // ==================== 主界面数据 ====================
        const zones = {
            1: { name: "教学楼区", desc: "24路摄像头", icon: "🏫", cameras: 24, online: 24, alerts: 2, camPrefix: "教学楼", buildingName: "知行教学楼", floors: 4 },
            2: { name: "宿舍生活区", desc: "32路摄像头", icon: "🏠", cameras: 32, online: 31, alerts: 1, camPrefix: "宿舍楼", buildingName: "明德公寓", floors: 4 },
            3: { name: "食堂餐饮区", desc: "18路摄像头", icon: "🍽️", cameras: 18, online: 18, alerts: 0, camPrefix: "食堂", buildingName: "思源餐厅", floors: 2 },
            4: { name: "体育运动区", desc: "16路摄像头", icon: "⚽", cameras: 16, online: 16, alerts: 1, camPrefix: "体育场", buildingName: "健体运动场", floors: 1 },
            5: { name: "图书馆区", desc: "12路摄像头", icon: "📚", cameras: 12, online: 11, alerts: 2, camPrefix: "图书馆", buildingName: "博雅图书馆", floors: 3 }
        };
        
        let currentZoneId = 1;
        let currentScenario = 'normal';
        
        function showToast(title, msg) { const t=document.getElementById('toast'); document.getElementById('toastTitle').innerHTML=title; document.getElementById('toastMsg').innerHTML=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
        function updateTime() { const n=new Date(); document.getElementById('currentTime').innerHTML=n.toLocaleTimeString(); document.getElementById('currentDate').innerHTML=n.toLocaleDateString(); }
        setInterval(updateTime,1000); updateTime();
        
        function switchZone(zoneId) { currentZoneId=zoneId; document.querySelectorAll('.zone-item').forEach(el=>{if(parseInt(el.dataset.zone)===zoneId)el.classList.add('active'); else el.classList.remove('active');}); renderMonitorGrid(); updateZoneStats(); }
        function updateZoneStats() { const z=zones[currentZoneId]; document.getElementById('zoneName').innerHTML=`${z.icon} ${z.name}`; document.getElementById('zoneDesc').innerHTML=z.desc; document.getElementById('onlineRate').innerHTML=`${Math.round(z.online/z.cameras*100)}%`; document.getElementById('todayAlerts').innerHTML=z.alerts; document.getElementById('zoneTotal').innerHTML=Math.floor(Math.random()*200+80); document.getElementById('avgDensity').innerHTML=(Math.random()*0.7+0.3).toFixed(2); document.getElementById('hotArea').innerHTML=`${z.name} 中心区`; document.getElementById('hotBar').style.width=`${Math.floor(Math.random()*70+25)}%`; }
        function renderMonitorGrid() { const z=zones[currentZoneId]; let h=''; for(let i=1;i<=6;i++){const cId=`${z.camPrefix}-${i}`; const cName=`${z.name} · 摄像头${i}`; const a=(z.alerts>0&&(i===2||i===5)); h+=`<div class="glass-card rounded-xl overflow-hidden monitor-card" data-cam-id="${cId}" data-cam-name="${cName}"><div class="px-3 py-2 border-b border-slate-700/50 flex justify-between items-center"><span class="text-[11px] font-medium">📹 ${cName}</span>${a?'<span class="text-[9px] text-red-400 animate-pulse">⚠️ 预警</span>':'<span class="text-[9px] text-green-400">● 正常</span>'}</div><div class="aspect-video bg-slate-900 relative"><img src="https://picsum.photos/seed/${cId}/400/225" class="w-full h-full object-cover opacity-85"><div class="absolute bottom-1 left-1 text-[8px] bg-black/60 px-1 rounded">${new Date().toLocaleTimeString()}</div></div></div>`; }
            document.getElementById('monitorGrid').innerHTML=h; document.querySelectorAll('.monitor-card').forEach(c=>c.addEventListener('click',()=>{openCameraModal(c.dataset.camName,c.dataset.camId);})); updateZoneStats(); }
        function openCameraModal(name,id){const m=document.getElementById('cameraModal'); document.getElementById('modalCameraName').innerHTML=`📹 ${name}`; document.getElementById('modalCameraImg').src=`https://picsum.photos/seed/${id}/1200/675`; document.getElementById('modalCameraDesc').innerHTML=`📍 位置：${name} | 状态：${currentScenario!=='normal'?'应急模式':'正常监控'} | 时间：${new Date().toLocaleString()}`; m.classList.remove('hidden'); m.style.display='flex'; }
        function closeCameraModal(){const m=document.getElementById('cameraModal'); m.classList.add('hidden'); m.style.display='none';}
        function setScenario(s){currentScenario=s; document.querySelectorAll('.scenario-btn').forEach(b=>{if(b.dataset.scenario===s)b.classList.add('active-scenario'); else b.classList.remove('active-scenario');}); showToast('应急场景',`${s==='normal'?'日常模式':s==='fire'?'消防疏散演习':s==='earthquake'?'地震避险模式':'校园封闭应急'} 已激活`);}
        function renderAlerts(){const a=[{type:'⚠️ 警告',msg:'教学楼东侧楼梯人群聚集',time:'2分钟前'},{type:'📢 提示',msg:'图书馆入口人流密度上升',time:'5分钟前'},{type:'⚠️ 警告',msg:'食堂后厨烟雾传感器触发',time:'12分钟前'}]; document.getElementById('alertList').innerHTML=a.map(x=>`<div class="bg-slate-800/40 rounded-lg p-2 border-l-4 border-orange-500"><div class="text-[10px] font-bold text-orange-400">${x.type}</div><div class="text-[11px] mt-1">${x.msg}</div><div class="text-[9px] text-slate-500 mt-1">${x.time}</div></div>`).join('');}
        function renderTeam(){const t=[{name:'张队长',role:'总指挥'},{name:'李副队',role:'巡逻组长'},{name:'王队员',role:'监控员'}]; document.getElementById('teamList').innerHTML=t.map(m=>`<div class="flex items-center gap-2 p-2 bg-slate-800/30 rounded-lg"><div class="w-7 h-7 rounded-full bg-gradient-to-br from-cyan-500 to-blue-500 flex items-center justify-center text-xs font-bold">${m.name[0]}</div><div class="flex-1"><div class="text-xs font-medium">${m.name}</div><div class="text-[9px] text-slate-400">${m.role}</div></div><div class="w-2 h-2 rounded-full bg-green-400"></div></div>`).join('');}
        function buildSidebar(){const zc=document.getElementById('zoneMenu'); zc.innerHTML=''; Object.entries(zones).forEach(([id,val])=>{const b=document.createElement('button'); b.className=`zone-item w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition-all flex items-center gap-2 bg-slate-800/30 ${parseInt(id)===currentZoneId?'active':''}`; b.dataset.zone=id; b.innerHTML=`<span>${val.icon}</span><span>${val.name}</span><span class="ml-auto text-[9px] text-slate-400">${val.cameras}路</span>`; b.onclick=()=>switchZone(parseInt(id)); zc.appendChild(b);}); const sc=document.getElementById('scenarioMenu'); sc.innerHTML=''; const scs=[{id:'normal',name:'日常模式',icon:'check-circle'},{id:'fire',name:'消防疏散演习',icon:'fire'},{id:'earthquake',name:'地震避险模式',icon:'mountain'},{id:'lockdown',name:'校园封闭应急',icon:'lock'}]; scs.forEach(s=>{const b=document.createElement('button'); b.className=`scenario-btn w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition-all flex items-center gap-2 bg-slate-800/30 border ${s.id==='normal'?'border-cyan-500/30 active-scenario':'border-transparent'}`; b.dataset.scenario=s.id; b.innerHTML=`<i class="fas fa-${s.icon} text-xs"></i> ${s.name}`; b.onclick=()=>setScenario(s.id); sc.appendChild(b);});}
        function triggerEmergency(){showToast('⚠️ 紧急预案启动','所有安保人员立即就位！请遵循疏散指引！'); if(currentScenario==='normal')setScenario('fire');}
        
        // ==================== 多楼层建筑布局数据 ====================
        const buildingLayouts = {
            1: {
                name: "知行教学楼",

        // ==================== 核心修复：真实人数模拟 ====================
        function generateHeatmapData() {
            const rooms = getCurrentRooms();
            if(!rooms.length) return [];
            const data = [];
            let baseFactor = currentScenario === 'fire' ? 1.3 : currentScenario === 'earthquake' ? 0.6 : currentScenario === 'lockdown' ? 1.15 : 1.0;
            
            rooms.forEach(room => {
                // ===== 1. 根据时间段计算基础占用率 =====
                let occ = 0.25; // 基础占用率（非上课时段也有少量人）
                const hour = heatmapCurrentTime;
                
                // 上课时段（8:00-12:00, 14:00-17:00）高占用
                if (hour >= 8 && hour < 12) occ = 0.75;
                else if (hour >= 14 && hour < 17) occ = 0.70;
                // 午休时段（12:00-14:00）中等占用
                else if (hour >= 12 && hour < 14) occ = 0.50;
                // 晚自习/课后（17:00-19:00）中等偏低
                else if (hour >= 17 && hour < 19) occ = 0.40;
                // 早晨（7:00-8:00）逐渐进入
                else if (hour >= 7 && hour < 8) occ = 0.30;
                // 晚间（19:00-22:00）少量
                else if (hour >= 19 && hour < 22) occ = 0.20;
                // 深夜/凌晨（22:00-7:00）极少
                else occ = 0.08;
                
                // ===== 2. 根据房间类型调整占用率 =====
                const typeMultiplier = {
                    '教室': 1.0,
                    '专用教室': 1.0,
                    '实验室': 0.95,
                    '机房': 0.90,
                    '办公室': 0.70,
                    '活动室': 0.60,
                    '大厅': 0.55,
                    '走廊': 0.30,
                    '楼梯间': 0.25,
                    '卫生间': 0.20,
                    '宿舍': 0.60,
                    '阅览室': 0.65,
                    '书库': 0.40,
                    '报告厅': 0.50,
                    '研讨室': 0.55,
                    '服务台': 0.50
                };
                const mult = typeMultiplier[room.type] || 0.50;
                occ = occ * mult;
                
                // ===== 3. 应急场景修正 =====
                occ = Math.min(0.95, Math.max(0.05, occ * baseFactor));
                
                // ===== 4. 计算实际人数（与容量成正比） =====
                let count = Math.floor(room.cap * occ);
                
                // ===== 5. 确保每个房间至少有合理人数 =====
                // 教室：至少10人（让教室看起来有人气）
                if (room.type === '教室' || room.type === '专用教室' || room.type === '实验室') {
                    count = Math.max(10, count);
                }
                // 办公室：至少3人
                else if (room.type === '办公室') {
                    count = Math.max(3, count);
                }
                // 大厅：至少8人
                else if (room.type === '大厅') {
                    count = Math.max(8, count);
                }
                // 其他房间：至少2人
                else {
                    count = Math.max(2, count);
                }
                
                // 防止超出容量太多
                count = Math.min(room.cap, count);
                
                // ===== 6. 生成热力点 =====
                // 安全边界（内边距，让点不紧贴墙壁）
                const padX = Math.max(4, (room.w || 70) * 0.06);
                const padY = Math.max(4, (room.h || 70) * 0.06);
                const minX = room.x + padX;
                const maxX = room.x + (room.w || 70) - padX;
                const minY = room.y + padY;
                const maxY = room.y + (room.h || 70) - padY;
                
                // 如果房间太小，在中心生成
                if (maxX <= minX || maxY <= minY) {
                    const cx = room.x + (room.w || 70) / 2;
                    const cy = room.y + (room.h || 70) / 2;
                    for (let i = 0; i < Math.min(count, 30); i++) {
                        data.push([cx + (Math.random() - 0.5) * 8, cy + (Math.random() - 0.5) * 8, 35 + occ * 55]);
                    }
                    return;
                }
                
                // 生成 points
                for (let i = 0; i < count; i++) {
                    let x, y;
                    if (Math.random() > 0.25) {
                        // 均匀分布
                        x = minX + Math.random() * (maxX - minX);
                        y = minY + Math.random() * (maxY - minY);
                    } else {
                        // 倾向中心聚集（模拟自然聚集）
                        const cx = (minX + maxX) / 2;
                        const cy = (minY + maxY) / 2;
                        const rx = (maxX - minX) / 3;
                        const ry = (maxY - minY) / 3;
                        x = cx + (Math.random() - 0.5) * rx * 1.8;
                        y = cy + (Math.random() - 0.5) * ry * 1.8;
                        x = Math.max(minX, Math.min(maxX, x));
                        y = Math.max(minY, Math.min(maxY, y));
                    }
                    // 强度与占用率相关，加入随机波动让热力更自然
                    const intensity = 30 + occ * 60 + (Math.random() - 0.5) * 15;
                    data.push([x, y, Math.max(15, Math.min(100, intensity))]);
                }
            });
            return data;
        }

            let maxOcc = 0, hotRoom = '';
            rooms.forEach(r => { 
                const cnt = data.filter(d => d[0] >= r.x && d[0] <= r.x + (r.w||70) && d[1] >= r.y && d[1] <= r.y + (r.h||70)).length; 
                const occ = r.cap > 0 ? cnt / r.cap : 0; 
                if(occ > maxOcc && r.type !== '走廊' && r.type !== '楼梯间'){ 
                    maxOcc = occ; 
                    hotRoom = r.name; 
                } 
            });
            document.getElementById('heatmapFloorTotal').textContent = total;
            document.getElementById('heatmapHotestArea').textContent = hotRoom || '暂无数据';
            document.getElementById('heatmapAvgDensity').textContent = `${avgDens} 人/m²`;
            document.getElementById('heatmapCurrentZoneTitle').innerHTML = `${zone.icon} ${zone.name} · ${building?.name||''} ${heatmapCurrentFloor}F`;
        }
        
        function updateHeatmapTrendChart() { 
            if (!heatmapTrendChart) return;
            const hours=['8:00','10:00','12:00','14:00','16:00','18:00','20:00']; 
            const vals=hours.map(()=>40+Math.random()*80); 
            heatmapTrendChart.setOption({ 
                backgroundColor:'transparent', 
                grid:{left:0,right:0,top:5,bottom:5}, 
                xAxis:{data:hours,show:false}, 
                yAxis:{show:false}, 
                series:[{
                    data:vals,type:'line',smooth:true,symbol:'none',
                    lineStyle:{color:'#f59e0b',width:2},
                    areaStyle:{opacity:0.25,color:'#f59e0b'}
                }] 
            }); 
        }
        
        function showHeatmapRoomDetails(point) {
            if (!point || point.length < 2) return;
            const rooms = getCurrentRooms(); 
            const room = rooms.find(r => point[0] >= r.x && point[0] <= r.x + (r.w||70) && point[1] >= r.y && point[1] <= r.y + (r.h||70));
            if(!room) return; 
            // 根据点击位置估算当前人数（用实际数据中的点数来估算）
            const cnt = data.filter(d => d[0] >= room.x && d[0] <= room.x + (room.w||70) && d[1] >= room.y && d[1] <= room.y + (room.h||70)).length;
            const occ = Math.min(room.cap, Math.max(3, cnt));
            const pct = Math.round((occ / room.cap) * 100);
            const status = pct > 75 ? '拥挤' : (pct > 45 ? '适中' : '空闲');
            const color = pct > 75 ? 'red-500' : (pct > 45 ? 'yellow-500' : 'green-500');
            document.getElementById('heatmapRoomDetails').innerHTML = `
                <div class="bg-slate-800/40 rounded-lg p-3 border-l-4 border-${color}">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-white text-sm">${room.name}</span>
                        <span class="text-[10px] px-2 py-0.5 rounded bg-${color}/20 text-${color}">${status}</span>
                    </div>
                    <div class="text-[11px] text-slate-400">${room.type} · 容量 ${room.cap} 人</div>
                    <div class="mt-2">
                        <div class="flex justify-between text-[10px]">
                            <span>当前估算人数</span>
                            <span>${occ} / ${room.cap}</span>
                        </div>
                        <div class="w-full bg-slate-700 rounded-full h-1.5 mt-1">
                            <div class="h-1.5 rounded-full bg-${color}" style="width:${pct}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }
        // 缓存数据用于详情显示
        let data = [];
        
        function openHeatmapModal() {
            const modal = document.getElementById('heatmapModal');
            const content = document.getElementById('heatmapContent');
            const zone = zones[heatmapCurrentZone];
            const building = buildingLayouts[heatmapCurrentZone];
            const maxFloor = zone?.floors || (building?.floors ? Object.keys(building.floors).length : 4);
            content.innerHTML = `
                <div style="height:100%; display:flex; flex-direction:column;">
                    <div class="modal-header-bar"><div class="flex items-center gap-3"><div class="w-9 h-9 bg-gradient-to-br from-orange-500 to-red-500 rounded-lg flex items-center justify-center"><i class="fas fa-building text-white"></i></div><div><h1 class="text-lg font-bold text-white">多楼层热力图监控系统 · 真实建筑布局</h1><p class="text-xs text-slate-400">专业平面图 | 实时人流热力分析 | 支持多楼层切换</p></div></div><button id="closeHeatmapModalBtn" class="modal-close-btn">✕</button></div>
                    <div style="flex:1; display:flex; overflow:hidden;">
                        <div class="w-56 glass-panel flex flex-col border-r border-slate-700/50" style="background:rgba(30,41,59,0.9);">
                            <div class="p-3 border-b border-slate-700/50"><h2 class="text-xs font-semibold text-slate-300 mb-2"><i class="fas fa-layer-group text-orange-400 mr-1"></i>区域选择</h2>
                            <div class="space-y-1.5" id="heatmapZoneButtons">${Object.entries(zones).map(([id,val])=>`<button class="zone-heatmap-btn w-full text-left px-3 py-2 rounded-lg text-xs transition-all ${parseInt(id)===heatmapCurrentZone?'bg-orange-500/20 border-orange-500 text-orange-400 border':'border-transparent text-slate-400 hover:bg-slate-700/50'}" data-zone-id="${id}"><div>${val.icon} ${val.name}</div><div class="text-[9px] text-slate-500">${val.buildingName}</div></button>`).join('')}</div></div>
                            <div class="p-3 border-b border-slate-700/50"><h2 class="text-xs font-semibold text-slate-300 mb-2"><i class="fas fa-arrow-up-down text-orange-400 mr-1"></i>楼层选择</h2><div class="grid grid-cols-4 gap-1.5" id="floorTabsContainer">${Array.from({length:maxFloor},(_,i)=>`<button class="floor-tab px-2 py-1.5 rounded-md text-center text-xs bg-slate-800/50 ${i+1===heatmapCurrentFloor?'active':'text-slate-400'}" data-floor="${i+1}">${i+1}F</button>`).join('')}</div></div>
                            <div class="p-3 flex-1"><h2 class="text-xs font-semibold text-slate-300 mb-2"><i class="fas fa-chart-pie text-orange-400 mr-1"></i>实时统计</h2><div class="space-y-2"><div class="bg-slate-800/40 rounded-lg p-2"><div class="text-[9px] text-slate-400">当前楼层人数</div><div class="text-xl font-bold text-white" id="heatmapFloorTotal">0</div></div><div class="bg-slate-800/40 rounded-lg p-2"><div class="text-[9px] text-slate-400">最拥挤区域</div><div class="text-xs font-semibold text-red-400" id="heatmapHotestArea">-</div><div class="w-full bg-slate-700 rounded-full h-1 mt-1"><div class="bg-red-500 h-1 rounded-full" id="heatmapHotBar" style="width:0%"></div></div></div><div class="bg-slate-800/40 rounded-lg p-2"><div class="text-[9px] text-slate-400">平均密度</div><div class="text-base font-bold text-orange-400" id="heatmapAvgDensity">0 人/m²</div></div></div></div>
                        </div>
                        <div style="flex:1; display:flex; flex-direction:column; min-width:0;">
                            <div class="h-12 glass-panel border-b border-slate-700/50 flex items-center justify-between px-4"><div class="flex gap-2"><button class="px-3 py-1 rounded-md text-xs font-medium bg-orange-600 text-white" id="heatmapViewHeatmap">热力图</button><button class="px-3 py-1 rounded-md text-xs font-medium text-slate-400" id="heatmapViewScatter">散点图</button></div><div><span id="heatmapCurrentZoneTitle" class="text-xs text-orange-400 font-semibold">${zone.icon} ${zone.name} · ${building?.name||''} 1F</span></div><div class="flex gap-2"><button class="w-7 h-7 rounded-lg bg-slate-800" id="heatmapZoomIn"><i class="fas fa-plus text-xs"></i></button><button class="w-7 h-7 rounded-lg bg-slate-800" id="heatmapZoomOut"><i class="fas fa-minus text-xs"></i></button><button class="w-7 h-7 rounded-lg bg-slate-800" id="heatmapResetView"><i class="fas fa-expand text-xs"></i></button></div></div>
                            <div class="flex-1 relative p-3 grid-bg"><div class="w-full h-full" id="heatmapChart"></div><div class="absolute bottom-3 right-3 glass-panel rounded-lg p-1.5"><div class="flex items-center gap-1"><div class="w-16 h-1.5 legend-gradient rounded"></div><span class="text-[8px] text-slate-400 ml-1">低 → 高</span></div></div></div>
                            <div class="h-20 glass-panel border-t border-slate-700/50 px-4 py-2"><div class="flex justify-between mb-1"><span class="text-[9px] text-slate-400">时间轴</span><div class="flex gap-1"><button id="heatmapPrevTime" class="w-6 h-6 rounded bg-slate-700 text-xs"><i class="fas fa-chevron-left"></i></button><button id="heatmapPlayBtn" class="w-6 h-6 rounded bg-orange-600 text-xs"><i class="fas fa-play"></i></button><button id="heatmapNextTime" class="w-6 h-6 rounded bg-slate-700 text-xs"><i class="fas fa-chevron-right"></i></button></div></div><input type="range" min="0" max="23" value="14" class="slider-track w-full" id="heatmapTimeSlider"><div class="flex justify-between mt-1 text-[8px] text-slate-500"><span>8:00</span><span>10:00</span><span>12:00</span><span class="text-orange-400">14:00</span><span>16:00</span><span>18:00</span><span>20:00</span></div></div>
                        </div>
                        <div class="w-64 glass-panel border-l border-slate-700/50 flex flex-col"><div class="p-2 border-b"><h2 class="text-xs font-semibold text-slate-300">区域详情</h2><p class="text-[9px] text-slate-500">点击热力区域查看</p></div><div class="flex-1 overflow-y-auto p-2 space-y-2" id="heatmapRoomDetails"><div class="text-center text-slate-500 py-6 text-xs"><i class="fas fa-mouse-pointer text-xl mb-1"></i><p>点击地图查看</p></div></div><div class="p-2 border-t"><h3 class="text-[10px] font-semibold text-slate-400 mb-1">今日趋势</h3><div id="heatmapTrendChart" style="height:80px;"></div></div></div>
                    </div>
                </div>`;
            modal.classList.add('active');
            setTimeout(() => { initHeatmapChart(); bindHeatmapEvents(); }, 150);
        }
        
        function bindHeatmapEvents() {
            document.querySelectorAll('.zone-heatmap-btn').forEach(btn => { btn.onclick = () => { const z=parseInt(btn.dataset.zoneId); heatmapCurrentZone=z; heatmapCurrentFloor=1; const zone=zones[z]; const building=buildingLayouts[z]; const maxFloor=zone?.floors||(building?.floors?Object.keys(building.floors).length:4); document.querySelectorAll('.zone-heatmap-btn').forEach(b=>b.classList.remove('bg-orange-500/20','border-orange-500','text-orange-400')); btn.classList.add('bg-orange-500/20','border-orange-500','text-orange-400'); const floorContainer=document.getElementById('floorTabsContainer'); if(floorContainer){ floorContainer.innerHTML=Array.from({length:maxFloor},(_,i)=>`<button class="floor-tab px-2 py-1.5 rounded-md text-center text-xs bg-slate-800/50 ${i+1===heatmapCurrentFloor?'active':'text-slate-400'}" data-floor="${i+1}">${i+1}F</button>`).join(''); document.querySelectorAll('.floor-tab').forEach(t=>{ t.onclick=()=>{ heatmapCurrentFloor=parseInt(t.dataset.floor); document.querySelectorAll('.floor-tab').forEach(ft=>ft.classList.remove('active')); t.classList.add('active'); updateHeatmapChart(); showToast('楼层切换',`切换到 ${heatmapCurrentFloor}F`); }; }); } updateHeatmapChart(); showToast('区域联动',`切换到 ${zones[z].name}`); }; });
            document.getElementById('heatmapViewHeatmap').onclick = () => { heatmapCurrentView='heatmap'; updateHeatmapChart(); };
            document.getElementById('heatmapViewScatter').onclick = () => { heatmapCurrentView='scatter'; updateHeatmapChart(); };
            document.getElementById('heatmapTimeSlider').oninput = (e) => { heatmapCurrentTime = parseInt(e.target.value); updateHeatmapChart(); };
            document.getElementById('heatmapPrevTime').onclick = () => { heatmapCurrentTime = Math.max(0, heatmapCurrentTime-1); document.getElementById('heatmapTimeSlider').value = heatmapCurrentTime; updateHeatmapChart(); };
            document.getElementById('heatmapNextTime').onclick = () => { heatmapCurrentTime = Math.min(23, heatmapCurrentTime+1); document.getElementById('heatmapTimeSlider').value = heatmapCurrentTime; updateHeatmapChart(); };
            document.getElementById('heatmapPlayBtn').onclick = () => { heatmapIsPlaying = !heatmapIsPlaying; if(heatmapIsPlaying) heatmapPlayInterval = setInterval(() => { heatmapCurrentTime = (heatmapCurrentTime + 1) % 24; document.getElementById('heatmapTimeSlider').value = heatmapCurrentTime; updateHeatmapChart(); }, 800); else clearInterval(heatmapPlayInterval); document.getElementById('heatmapPlayBtn').innerHTML = heatmapIsPlaying ? '<i class="fas fa-pause text-xs"></i>' : '<i class="fas fa-play text-xs"></i>'; };
            document.getElementById('heatmapZoomIn').onclick = () => heatmapChart?.dispatchAction({ type: 'dataZoom', start: 15, end: 85 });
            document.getElementById('heatmapZoomOut').onclick = () => heatmapChart?.dispatchAction({ type: 'dataZoom', start: 0, end: 100 });
            document.getElementById('heatmapResetView').onclick = () => heatmapChart?.dispatchAction({ type: 'restore' });
            document.getElementById('closeHeatmapModalBtn').onclick = () => { document.getElementById('heatmapModal').classList.remove('active'); if(heatmapPlayInterval) clearInterval(heatmapPlayInterval); };
            document.getElementById('heatmapModal').onclick = (e) => { if(e.target === document.getElementById('heatmapModal')) { document.getElementById('heatmapModal').classList.remove('active'); if(heatmapPlayInterval) clearInterval(heatmapPlayInterval); } };
            document.querySelectorAll('.floor-tab').forEach(t=>{ t.onclick=()=>{ heatmapCurrentFloor=parseInt(t.dataset.floor); document.querySelectorAll('.floor-tab').forEach(ft=>ft.classList.remove('active')); t.classList.add('active'); updateHeatmapChart(); showToast('楼层切换',`切换到 ${heatmapCurrentFloor}F`); }; });
        }
        
        buildSidebar(); renderMonitorGrid(); renderAlerts(); renderTeam(); setScenario('normal');
        document.getElementById('openHeatmapBtn').addEventListener('click', openHeatmapModal);
        document.getElementById('emergencyBtn').addEventListener('click', triggerEmergency);
    </script>
</body>
</html>
