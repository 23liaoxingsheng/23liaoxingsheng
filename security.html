<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>校园火灾智能安防监控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #0b1020;
            color: #fff;
        }
        /* 顶部导航 */
        .top-bar {
            height: 50px;
            background-color: #10254a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 1px solid rgba(0, 180, 255, 0.3);
        }
        .top-bar .title {
            color: #00d4ff;
            font-size: 18px;
            font-weight: bold;
        }
        .top-bar .right-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .top-bar .status {
            color: #fff;
        }
        .top-bar .login-btn {
            background-color: #0099ff;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
        }

        /* 整体布局 */
        .container {
            display: flex;
        }

        /* 左侧导航 */
        .sidebar {
            width: 100px;
            background-color: #0b152b;
            height: calc(100vh - 50px);
            border-right: 1px solid rgba(0, 180, 255, 0.2);
            padding-top: 20px;
        }
        .sidebar .menu-item {
            display: block;
            padding: 12px 15px;
            color: #a0d8ff;
            text-decoration: none;
            font-size: 15px;
            margin-bottom: 5px;
        }
        .sidebar .menu-item.active {
            background-color: rgba(0, 150, 220, 0.2);
            color: #00d4ff;
            border-left: 2px solid #00d4ff;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            padding: 15px;
        }

        /* 火情预警栏 */
        .fire-alert {
            background-color: #2b1520;
            border: 1px solid rgba(255, 80, 80, 0.3);
            border-radius: 4px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }
        .fire-alert p {
            margin: 5px 0;
        }
        .fire-alert .btn-group {
            margin-top: 10px;
        }
        .fire-alert .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            margin: 0 5px;
            cursor: pointer;
        }
        .fire-alert .btn.confirm {
            background-color: #00b866;
            color: #fff;
        }
        .fire-alert .btn.false {
            background-color: #666;
            color: #fff;
        }

        /* 全域监控布局 */
        .monitor-area {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }
        .monitor-card {
            background-color: #0b152b;
            border: 1px solid rgba(0, 180, 255, 0.2);
            border-radius: 6px;
            padding: 10px;
            position: relative;
        }
        /* 火情监控卡片红色边框 */
        .monitor-card.fire-active {
            border: 1px solid rgba(255, 80, 80, 0.6);
            box-shadow: 0 0 10px rgba(255, 80, 80, 0.3);
        }
        .monitor-card .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .monitor-card .name {
            color: #00d4ff;
            background-color: rgba(0, 150, 220, 0.15);
            padding: 3px 8px;
            border-radius: 3px;
        }
        .monitor-card .status {
            color: #ff6666;
        }
        /* 视频框 */
        .video-box {
            width: 100%;
            height: 180px;
            background-color: #1a2035;
            border-radius: 4px;
            overflow: hidden;
        }
        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 占位框 */
        .placeholder-box {
            width: 100%;
            height: 100%;
            background-color: #2a3045;
            border-radius: 4px;
        }

        /* 右侧运行状态 */
        .status-panel {
            background-color: #0b152b;
            border: 1px solid rgba(0, 180, 255, 0.2);
            border-radius: 6px;
            padding: 15px;
        }
        .status-panel h3 {
            color: #00d4ff;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(0, 180, 255, 0.2);
            padding-bottom: 5px;
        }
        .status-panel p {
            margin: 8px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="top-bar">
        <div class="title">校园火灾智能安防监控系统</div>
        <div class="right-info">
            <span class="status">运行正常</span>
            <button class="login-btn">返回登录</button>
        </div>
    </div>

    <div class="container">
        <!-- 左侧导航栏 -->
        <div class="sidebar">
            <a href="#" class="menu-item active">监控大厅</a>
            <a href="#" class="menu-item">火情预警</a>
            <a href="#" class="menu-item">设备状态</a>
            <a href="#" class="menu-item">值班日志</a>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 火情预警栏 -->
            <div class="fire-alert">
                <p>系统检测火情信号</p>
                <p>起火位置：一号教学楼二层教室</p>
                <p>危险等级：2级：中度火情</p>
                <div class="btn-group">
                    <button class="btn confirm">已核实确认火情</button>
                    <button class="btn false">火情误报</button>
                </div>
            </div>

            <h3 style="color:#00d4ff; margin-bottom:10px;">全域实时监控</h3>
            <div class="monitor-area">
                <!-- 一号教学楼（视频框） -->
                <div class="monitor-card fire-active">
                    <div class="header">
                        <span class="name">一号教学楼</span>
                        <span class="status">在线监测</span>
                    </div>
                    <div class="video-box">
                        <!-- 这里是视频标签，替换src为你的视频路径即可 -->
                        <video src="your-video.mp4" autoplay muted loop playsinline>
                            您的浏览器不支持视频播放
                        </video>
                    </div>
                </div>

                <!-- 右侧区域 -->
                <div style="display:flex; flex-direction:column; gap:15px;">
                    <!-- 二号教学楼 -->
                    <div class="monitor-card">
                        <div class="header">
                            <span class="name">二号教学楼</span>
                            <span class="status">在线监测</span>
                        </div>
                        <div class="placeholder-box" style="height:80px;"></div>
                    </div>

                    <!-- 校园食堂 -->
                    <div class="monitor-card">
                        <div class="header">
                            <span class="name">校园食堂</span>
                            <span class="status">在线监测</span>
                        </div>
                        <div class="placeholder-box" style="height:80px;"></div>
                    </div>

                    <!-- 运行状态 -->
                    <div class="status-panel">
                        <h3>运行状态</h3>
                        <p>监控设备：全部在线</p>
                        <p>传感模块：正常启用</p>
                        <p>数据状态：待人工核实推送</p>
                    </div>
                </div>

                <!-- 室外疏散通道 -->
                <div class="monitor-card" style="grid-column:1 / -1;">
                    <div class="header">
                        <span class="name">室外疏散通道</span>
                        <span class="status">在线监测</span>
                    </div>
                    <div class="placeholder-box" style="height:50px;"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
