<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园监控及上报平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body {
            background: #050d1b;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 150, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(0, 150, 255, 0.05) 0%, transparent 50%);
        }

        .top-header {
            background: linear-gradient(90deg, #0a1427, #0d1b36);
            padding: 15px 30px;
            border-bottom: 1px solid #1f3a6b;
            box-shadow: 0 0 20px rgba(0, 100, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .back-btn{
            position: absolute;
            left:20px;
            top:50%;
            transform: translateY(-50%);
            padding:6px 14px;
            background:linear-gradient(135deg,#2986cc,#40a9ff);
            border:none;
            border-radius:6px;
            color:#fff;
            cursor:pointer;
            font-size:14px;
        }
        .back-btn:hover{
            box-shadow:0 0 10px #2070ff60;
        }
        .header-title {
            font-size: 22px;
            color: #4dd0e1;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(77, 208, 225, 0.5);
            letter-spacing: 2px;
        }
        .status-indicator {
            position: absolute;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4ade80;
            font-size: 14px;
        }
        .alarm-status{
            color:#ff4444;
            animation: flash 1s infinite;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1;}50%{opacity:0.5;} }
        @keyframes flash {0%,100%{opacity:1;}50%{opacity:0.3;}}

        .alarm-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;display:flex;align-items:center;justify-content:center;}
        .alarm-box{background:linear-gradient(145deg,#2b1010,#441818);border:2px solid #ff4444;border-radius:15px;width:500px;padding:40px 30px;text-align:center;box-shadow:0 0 30px #ff4444;}
        .alarm-box h2{color:#ff4444;font-size:28px;margin-bottom:20px;}
        .alarm-box p{font-size:18px;line-height:2;color:#fff;}
        .jump-btn{margin-top:30px;padding:15px 40px;background:#ff4444;color:#fff;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;}
        .jump-btn:hover{background:#dd2222;}

        .main-container{flex:1;padding:25px;overflow-y:auto;}
        .layout-wrap{display:flex;gap:20px;width:100%;}
        .monitor-name-sidebar{width:220px;background:linear-gradient(145deg,#0a1427,#0d1b36);border-radius:12px;padding:15px;border:1px solid #1f3a6b;box-shadow:0 4px 20px rgba(0,100,255,0.15);}
        .monitor-name-sidebar h4{font-size:16px;color:#4dd0e1;margin-bottom:12px;text-align:center;}
        .monitor-name-item{font-size:17px;padding:12px 10px;margin-bottom:8px;color:#eee;background:#080e1b;border-radius:8px;cursor:pointer;transition:0.2s;}
        .monitor-name-item:hover{background:#142544;}
        .monitor-name-item.active{background:#2986cc;color:#fff;font-weight:bold;}

        .monitor-section{flex:1;background:linear-gradient(145deg,#0a1427,#0d1b36);border-radius:12px;padding:20px;border:1px solid #1f3a6b;box-shadow:0 4px 20px rgba(0,100,255,0.15);}
        .monitor-card{width:100%;aspect-ratio:16/9;background:#080e1b;border:1px solid #1f3a6b;border-radius:8px;overflow:hidden;box-shadow:0 0 15px rgba(0,100,255,0.1);transition:all 0.3s;position:relative;}
        .monitor-status{position:absolute;right:12px;top:12px;width:10px;height:10px;background:#4ade80;border-radius:50%;box-shadow:0 0 5px #4ade80;}
        .monitor-status.danger{background:#ff4444;box-shadow:0 0 5px #ff4444;}
        .monitor-screen{width:100%;height:100%;background:#050d1b;position:relative;}
        .monitor-screen.warn-bg{background:#1a0808;}
        .monitor-video{width:100%;height:100%;object-fit:cover;display:none;}
        .page-btn-group{margin-top:15px;display:flex;justify-content:center;gap:15px;}
        .page-btn{padding:8px 22px;background:linear-gradient(135deg,#2986cc,#40a9ff);border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:15px;}
        .page-btn:disabled{background:#444;cursor:not-allowed;}

        .report-section{margin-top:20px;background:linear-gradient(145deg,#0a1427,#0d1b36);border-radius:12px;padding:20px;border:1px solid #1f3a6b;box-shadow:0 4px 20px rgba(0,100,255,0.15);}
        .section-title{font-size:18px;color:#4dd0e1;font-weight:500;margin-bottom:18px;display:flex;align-items:center;gap:10px;}
        .report-form{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
        .form-item{display:flex;flex-direction:column;gap:6px;}
        .form-item-full{grid-column:span 2;}
        .form-label{font-size:14px;color:#a5b4d3;}
        .form-select,.form-textarea{background:#080e1b;border:1px solid #2a4b8d;border-radius:6px;padding:10px;color:#fff;outline:none;}
        .form-textarea{resize:none;}
        .plan-box{grid-column:span 2;background:#080e1b;border:1px solid #2a4b8d;border-radius:6px;padding:15px;line-height:1.8;font-size:14px;color:#e0eaff;}
        .plan-box h4{color:#4dd0e1;margin-bottom:8px;font-size:15px;}
        .btn-group{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;grid-column:span 2;margin-top:8px;}
        .btn-verify{padding:12px;background:linear-gradient(135deg,#2986cc,#40a9ff);border:none;border-radius:8px;color:#fff;font-size:14px;cursor:pointer;}
        .btn-reject{padding:12px;background:linear-gradient(135deg,#996633,#cc8844);border:none;border-radius:8px;color:#fff;font-size:14px;cursor:pointer;}
        .btn-start-plan{padding:12px;background:linear-gradient(135deg,#e64340,#ff7875);border:none;border-radius:8px;color:#fff;font-size:14px;cursor:pointer;}
        .btn-reset{padding:12px;background:linear-gradient(135deg,#555,#777);border:none;border-radius:8px;color:#fff;font-size:14px;cursor:pointer;}
        button:disabled{background:#444;cursor:not-allowed;opacity:0.7;}
    </style>
</head>
<body>

<div class="alarm-modal" id="alarmModal">
    <div class="alarm-box">
        <h2>⚠️ AI检测到火情</h2>
        <p>事发地点：食堂后厨监控</p>
        <p>火情状态：明火燃烧</p>
        <p>危险等级：二级一般火情</p>
        <button class="jump-btn" onclick="jumpToAlarmMonitor()">跳转到事发地监控</button>
    </div>
</div>

<div class="top-header">
    <!-- ✅ 修复点：把原来的 ../login.html 改成 index.html，直接回到登录页 -->
    <button class="back-btn" onclick="location.href='index.html'">返回登录页</button>
    <div class="header-title">校园监控及上报平台</div>
    <div class="status-indicator" id="systemStatus">
        <div class="status-dot"></div>
        <span>AI智能监控正常运行</span>
    </div>
</div>

<div class="main-container">
    <div class="layout-wrap">
        <div class="monitor-name-sidebar">
            <h4>监控点位</h4>
            <div id="nameListWrap"></div>
        </div>

        <div class="monitor-section">
            <div class="monitor-card" id="monitorCard">
                <div class="monitor-status" id="monitorStatus"></div>
                <div class="monitor-screen" id="monitorScreen">
                    <video class="monitor-video" id="monitorVideo" muted loop autoplay controls></video>
                </div>
            </div>
            <div class="page-btn-group">
                <button class="page-btn" id="prevBtn" onclick="prevPage()">上一页</button>
                <button class="page-btn" id="nextBtn" onclick="nextPage()">下一页</button>
            </div>
        </div>
    </div>

    <div class="report-section">
        <div class="section-title">火情核查、人工上报与应急处置</div>
        <div class="report-form">
            <div class="form-item">
                <label class="form-label">事发位置</label>
                <select class="form-select" id="firePos">
                    <option>教学楼楼道区域监控</option>
                    <option>实验室监控</option>
                    <option>食堂后厨监控</option>
                    <option>教室监控</option>
                    <option>储物间监控</option>
                    <option>宿舍楼楼道监控</option>
                </select>
            </div>
            <div class="form-item">
                <label class="form-label">火情等级</label>
                <select class="form-select" id="fireLevel" onchange="changePlan()">
                    <option value="1">一级轻微火情</option>
                    <option value="2" selected>二级一般火情</option>
                    <option value="3">三级重大火情</option>
                </select>
            </div>

            <div class="form-item form-item-full">
                <label class="form-label">应急预案</label>
                <textarea class="form-textarea" id="fireDesc" rows="3" placeholder="填写对应火情应急补充说明"></textarea>
            </div>

            <div class="form-item-full plan-box" id="planBox">
                <h4>二级中度火情处置方案</h4>
                <p>1.火势具备蔓延趋势，系统升级预警等级，暂停事发区域教学活动<br/>
                2.安保团队协同控火，封闭周边通道，防止烟雾与火势向外扩散<br/>
                3.为各个位置老师生成最佳疏散路线，随时根据指令准备局部人员疏散</p>
            </div>

            <div class="btn-group">
                <button class="btn-verify" id="verifyBtn" onclick="confirmAlarm()">核实火情上报</button>
                <button class="btn-reject" id="rejectBtn" onclick="cancelAlarm()">判定误报解除</button>
                <button class="btn-start-plan" id="planBtn" onclick="manualReport()">手动提交上报记录</button>
                <button class="btn-reset" onclick="resetForm()">重置表单状态</button>
            </div>
        </div>
    </div>
</div>

<script>
    const monitorList = [
        "教学楼楼道区域监控",
        "实验室监控",
        "食堂后厨监控",
        "教室监控",
        "储物间监控",
        "宿舍楼楼道监控"
    ];
    const videoSrcArr = [
        "https://yinjigl.oss-cn-beijing.aliyuncs.com/video/your-video.mp4",
        "https://yinjigl.oss-cn-beijing.aliyuncs.com/video/shiyanshi.mp4",
        "https://yinjigl.oss-cn-beijing.aliyuncs.com/video/shitang.mp4",
        "https://yinjigl.oss-cn-beijing.aliyuncs.com/video/jiaoshi.mp4",
        "https://yinjigl.oss-cn-beijing.aliyuncs.com/video/chuwujian.mp4",
        "https://yinjigl.oss-cn-beijing.aliyuncs.com/video/sushe.mp4"
    ];
    const alarmIndex = 2;
    let currentPage = 0;
    const videoEle = document.getElementById('monitorVideo');
    const posSelect = document.getElementById('firePos');
    const nameListWrap = document.getElementById('nameListWrap');
    const alarmModal = document.getElementById('alarmModal');
    const verifyBtn = document.getElementById('verifyBtn');
    const rejectBtn = document.getElementById('rejectBtn');

    const planData = {
        1:{
            title:"一级轻度火情处置方案",
            content:"1.智能监控识别轻微火情隐患，仅触发局部预警，不启动全校警报<br/>2.安保人员立即前往事发点位，取用就近灭火器、消防栓开展初期灭火<br/>3.实时监控火势变化，阻断火源扩散，周边区域人员正常待命<br/>4.火情扑灭后核查现场，确认无复燃风险，记录隐患信息存档"
        },
        2:{
            title:"二级中度火情处置方案",
            content:"1.火势具备蔓延趋势，系统升级预警等级，暂停事发区域教学活动<br/>2.安保团队协同控火，封闭周边通道，防止烟雾与火势向外扩散<br/>3.为各个位置老师生成最佳疏散路线，随时根据指令准备局部人员疏散"
        },
        3:{
            title:"三级重度火情处置方案",
            content:"1.火势无法人为控制，立刻触发全校应急警报，终止所有校内活动<br/>2.为各班级教师生成疏散路线，带领学生弯腰捂口鼻有序撤离<br/>3.全员快速撤离至室外操场安全集结点，教师清点本班人数并上报<br/>4.校领导统筹现场救援，同步联系消防部门，配合专业人员开展灭火救援<br/>5.排查教学楼剩余滞留人员，全程把控现场秩序，杜绝二次安全事故"
        }
    };

    function changePlan(){
        let level = document.getElementById("fireLevel").value;
        document.getElementById("planBox").innerHTML = `<h4>${planData[level].title}</h4><p>${planData[level].content}</p>`;
    }

    function renderNameList(){
        nameListWrap.innerHTML = "";
        monitorList.forEach((name,idx)=>{
            const item = document.createElement("div");
            item.className = "monitor-name-item";
            item.innerText = name;
            item.onclick = ()=>{
                currentPage = idx;
                renderMonitor();
            };
            nameListWrap.appendChild(item);
        });
    }

    window.onload = function(){
        renderNameList();
        posSelect.value = monitorList[alarmIndex];
        document.getElementById("fireLevel").value = 2;
        changePlan();
        document.getElementById("fireDesc").value = "监控画面发现明火燃烧，存在蔓延风险，需立即启动对应等级应急处置流程";
        document.getElementById("monitorStatus").classList.add("danger");
        document.getElementById("monitorScreen").classList.add("warn-bg");
        verifyBtn.disabled = false;
        rejectBtn.disabled = false;
        renderMonitor();
    }

    function jumpToAlarmMonitor(){
        currentPage = alarmIndex;
        renderMonitor();
        alarmModal.style.display = "none";
    }

    function renderMonitor(){
        const items = nameListWrap.querySelectorAll(".monitor-name-item");
        items.forEach((it,idx)=>{
            it.classList.toggle("active", idx === currentPage);
        });
        posSelect.value = monitorList[currentPage];
        document.getElementById("prevBtn").disabled = currentPage === 0;
        document.getElementById("nextBtn").disabled = currentPage === monitorList.length - 1;

        const src = videoSrcArr[currentPage];
        if(src){
            videoEle.src = src;
            videoEle.style.display = "block";
        }else{
            videoEle.style.display = "none";
        }
    }

    function prevPage(){
        if(currentPage > 0){
            currentPage--;
            renderMonitor();
        }
    }
    function nextPage(){
        if(currentPage < monitorList.length - 1){
            currentPage++;
            renderMonitor();
        }
    }

    function confirmAlarm(){
        alert("已上报校领导并启动应急预案，相关处置指令下发执行");
        verifyBtn.disabled = true;
        rejectBtn.disabled = true;
    }
    function cancelAlarm(){
        alert("已判定为AI误报，火情告警解除，恢复常规监控");
        verifyBtn.disabled = true;
        rejectBtn.disabled = true;
        document.getElementById("monitorStatus").classList.remove("danger");
        document.getElementById("monitorScreen").classList.remove("warn-bg");
    }
    function manualReport(){
        let area = document.getElementById("firePos").value;
        let level = document.getElementById("fireLevel").options[document.getElementById("fireLevel").selectedIndex].text;
        alert(`已保存${area}${level}上报记录，存档完成`);
    }
    function resetForm(){
        document.getElementById("fireDesc").value = "";
        verifyBtn.disabled = false;
        rejectBtn.disabled = false;
        alert("表单与操作状态已重置，可重新核查上报");
    }
</script>

</body>
</html>
